[tool.poetry]
name = "langchain-kr"
version = "0.1.1"
description = "Ultimate LangChain Tutorial written in Korean by TeddyNote."
authors = ["teddy <teddylee777@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# UI 및 기본 설정
streamlit = ">=1.0,<2"
python-dotenv = ">=1.0,<2"
pydantic = ">=2.0,<3"

# LangChain / LangGraph (호환성 확보를 위해 하한선만 유지)
langgraph = ">=0.2.0,<1.0.0"
langchain-core = ">=0.3.0,<1.0.0"
langchain-community = ">=0.3.0,<1.0.0"
langchain-openai = ">=0.2.0,<1.0.0"
langchain-text-splitters = ">=0.3.0,<1.0.0"
langchain-huggingface = ">=0.0.3,<1.0.0"

# LLM API 및 검색
# openai: litellm(TruLens RAG Triad 경유)이 2.x를 요구해 <2 상한을 해제함.
# instructor(ragas의 Anthropic 어댑터 의존성)는 메타데이터상 <2.0.0을 요구해
# pip가 경고를 띄우지만, 실제로는 openai 2.x에서도 정상 동작 확인됨.
openai = ">=1.68"
duckduckgo-search = ">=6.0"
tenacity = ">=8.0,<9"

# RAG / 벡터 검색 (버전 범위를 넓혀 충돌 방지)
ragas = ">=0.2.0,<1.0.0"
faiss-cpu = ">=1.8,<2"
sentence-transformers = ">=3.0,<4"
scikit-learn = ">=1.3,<2"
huggingface-hub = ">=0.20.0,<1.0.0"
tiktoken = ">=0.7.0,<1.0.0"
pypdf = ">=4.0,<5"

# 평가 지표 — RAGAS 판정 LLM(Claude) · DeepEval RAG 지표(Gemini, google-genai 경유)
# 답변 생성 LLM(OpenAI/Gemini)과 판정 LLM을 분리해 순환성(circularity) 편향을 피하기 위함
anthropic = ">=0.60,<1.0.0"
deepeval = ">=4.0,<5"
google-genai = ">=1.0,<2"

# PDF 처리 및 OCR
pymupdf = ">=1.23,<2"          # fitz — PDF 텍스트 추출 및 페이지 렌더링
rapidocr-onnxruntime = ">=1.3" # 스캔 PDF OCR

# 데이터베이스
oracledb = ">=2.0,<3"           # Oracle DB (thin mode — Oracle Client 불필요)

# 데이터 처리 및 시각화
pandas = ">=2.0,<3"
matplotlib = ">=3.7,<4"
seaborn = ">=0.13,<1"
scipy = ">=1.11,<2"             # KDE 분포 시각화 (gaussian_kde)

# torch==2.2.0은 최신 서버 환경과 충돌하므로 최소 버전만 지정합니다.
# 2.11+ 는 PyPI 기본 빌드가 CUDA 13.0 런타임을 번들해 NVIDIA 드라이버 570.x(CUDA 12.8)에서
# torch.cuda.is_available()==False가 됩니다. 2.10.0까지는 CUDA 12.8 런타임을 번들해 호환됩니다.
torch = ">=2.2.0,<2.11.0"
# numpy 역시 특정 범위를 지정하기보다 최신 라이브러리들이 정하는 버전을 따르도록 합니다.
numpy = "*"

# main.ipynb 실행용 (Jupyter 커널)
ipykernel = ">=6.0"
ipywidgets = ">=8.0"

[tool.poetry.scripts]
medical-rag-ui = "launch:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
